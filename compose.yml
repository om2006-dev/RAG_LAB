services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${app_name}
      POSTGRES_PASSWORD: ${password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image:
      ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:

